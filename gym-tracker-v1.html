<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Tracker</title>
<style>
  :root{
    --page-bg: #1b1e1d;
    --device-bg: #f2f0e9;
    --device-border: #d9d4c6;
    --ink: #23272a;
    --ink-soft: #6b6f66;
    --line: #dcd7c9;
    --running: #2f6f52;
    --running-soft: #e3ede7;
    --danger: #b23a3a;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:var(--page-bg);
    display:flex;
    justify-content:center;
    padding: 28px 12px 60px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
  }
  .device{
    width:100%;
    max-width:480px;
    background:var(--device-bg);
    border:1px solid var(--device-border);
    border-radius:16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.35);
    overflow:hidden;
  }
  header{
    padding:18px 20px 14px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:1px solid var(--line);
  }
  header h1{ font-size:1.05rem; font-weight:650; margin:0; }
  header .date{ font-size:0.8rem; color:var(--ink-soft); }

  .tabbar{ display:flex; border-bottom:1px solid var(--line); }
  .tab-btn{
    flex:1; padding:11px 6px; background:transparent; border:none;
    font-size:0.82rem; color:var(--ink-soft); border-bottom:2px solid transparent;
    cursor:pointer; font-weight:550;
  }
  .tab-btn.active{ color:var(--ink); border-bottom-color:var(--running); }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  section{ padding:18px 20px; border-bottom:1px solid var(--line); }
  .tab-panel > section:last-child{ border-bottom:none; }
  .section-title{ font-size:0.78rem; color:var(--ink-soft); margin:0 0 10px; }

  button{
    font-family:inherit; font-size:0.88rem; padding:10px 18px; border-radius:8px;
    border:1px solid transparent; cursor:pointer; font-weight:550;
  }
  .btn-start{ background:var(--running); color:white; }
  .btn-finish{ background:var(--ink); color:white; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--ink); }
  .btn-danger{ background:transparent; border:1px solid var(--danger); color:var(--danger); }
  .btn-small{ padding:5px 10px; font-size:0.78rem; }
  .btn-block{ width:100%; text-align:center; }

  /* Template picker */
  .template-grid{ display:flex; flex-direction:column; gap:8px; }
  .template-btn{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px; border-radius:var(--radius); border:1px solid var(--line);
    background:white; font-size:0.92rem; font-weight:600; cursor:pointer; text-align:left;
  }
  .template-btn span.sub{ font-size:0.74rem; font-weight:400; color:var(--ink-soft); display:block; margin-top:2px; }

  /* Active session */
  .session-header{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--running-soft); border-radius:var(--radius); padding:14px 16px; margin-bottom:14px;
  }
  .session-header .name{ font-weight:650; font-size:0.95rem; }
  .session-header .meta{ font-size:0.76rem; color:var(--ink-soft); margin-top:2px; }
  .session-timer{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric:tabular-nums; font-size:1.1rem; }

  .exercise-card{
    background:white; border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:10px;
  }
  .exercise-card-head{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;
  }
  .exercise-name{ font-weight:600; font-size:0.9rem; }
  .exercise-vol{ font-size:0.74rem; color:var(--ink-soft); }

  .set-row{
    display:grid; grid-template-columns: 20px 1fr 1fr 60px 24px;
    gap:6px; align-items:center; font-size:0.82rem; padding:4px 0;
  }
  .set-row .set-num{ color:var(--ink-soft); font-size:0.74rem; }
  .set-row input{
    width:100%; padding:6px 6px; border-radius:6px; border:1px solid var(--line);
    font-size:0.82rem; text-align:center;
  }
  .set-row .set-vol{ font-size:0.72rem; color:var(--ink-soft); text-align:right; }
  .set-row .remove-set{
    background:none; border:none; color:var(--danger); font-size:0.9rem; padding:0; cursor:pointer;
  }
  .set-labels{
    display:grid; grid-template-columns: 20px 1fr 1fr 60px 24px; gap:6px;
    font-size:0.68rem; color:var(--ink-soft); margin-bottom:2px;
  }
  .add-set-row{ display:flex; justify-content:flex-end; margin-top:6px; }

  .add-exercise-row{ display:flex; gap:8px; margin-top:4px; }
  .add-exercise-row select{
    flex:1; padding:8px 10px; border-radius:8px; border:1px solid var(--line); font-size:0.85rem; background:white;
  }

  .empty-note{ color:var(--ink-soft); font-size:0.85rem; padding:6px 0; }

  /* History */
  .history-item{ border-top:1px solid var(--line); }
  .history-item:first-child{ border-top:none; }
  .history-item-head{
    display:flex; justify-content:space-between; padding:10px 0; cursor:pointer; font-size:0.88rem;
  }
  .history-item-head .sub{ font-size:0.74rem; color:var(--ink-soft); }
  .history-item-body{ display:none; padding-bottom:10px; }
  .history-item-body.open{ display:block; }
  .history-ex-row{ font-size:0.82rem; padding:4px 0; }
  .history-ex-row .sets{ color:var(--ink-soft); font-size:0.76rem; }

  .progress-controls{ margin-bottom:10px; }
  .progress-controls select{
    width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--line); font-size:0.85rem; background:white;
  }
</style>
</head>
<body>

<div class="device">
  <header>
    <h1>Gym Tracker</h1>
    <span class="date" id="headerDate"></span>
  </header>

  <div class="tabbar">
    <button class="tab-btn active" data-tab="train">Train</button>
    <button class="tab-btn" data-tab="history">History</button>
  </div>

  <!-- TRAIN TAB -->
  <div class="tab-panel active" id="tab-train">
    <section id="startSection">
      <div class="section-title">Start a workout</div>
      <div class="template-grid" id="templateGrid"></div>
    </section>

    <section id="activeSection" style="display:none;">
      <div class="session-header">
        <div>
          <div class="name" id="activeSessionName"></div>
          <div class="meta" id="activeSessionMeta"></div>
        </div>
        <div style="text-align:right;">
          <div class="session-timer" id="sessionTimer">0:00:00</div>
          <button class="btn-finish btn-small" id="finishBtn" style="margin-top:6px;">Finish</button>
        </div>
      </div>
      <div id="exerciseList"></div>
      <div class="add-exercise-row">
        <select id="addExerciseSelect"></select>
        <button class="btn-ghost btn-small" id="addExerciseBtn">+ Add</button>
      </div>
    </section>
  </div>

  <!-- HISTORY TAB -->
  <div class="tab-panel" id="tab-history">
    <section>
      <div class="section-title">Progress</div>
      <div class="progress-controls">
        <select id="progressExerciseSelect"></select>
      </div>
      <div id="progressChartContainer"></div>
    </section>

    <section>
      <div class="section-title">Past sessions</div>
      <div id="historyList"></div>
    </section>
  </div>
</div>

<script>
const STORAGE_KEY = 'gymTracker.v1';

const DEFAULT_TEMPLATES = [
  { id: 'tpl_push', name: 'Push', exercises: ['Bench Press', 'Overhead Press', 'Incline Dumbbell Press', 'Tricep Pushdown', 'Lateral Raise'] },
  { id: 'tpl_pull', name: 'Pull', exercises: ['Deadlift', 'Pull-up', 'Barbell Row', 'Face Pull', 'Bicep Curl'] },
  { id: 'tpl_legs', name: 'Legs', exercises: ['Squat', 'Romanian Deadlift', 'Leg Press', 'Leg Curl', 'Calf Raise'] }
];

function loadData(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{ return JSON.parse(raw); }catch(e){ /* fall through */ }
  }
  return {
    templates: DEFAULT_TEMPLATES,
    sessions: [] // { id, templateName, startedAt, finishedAt, exercises: [{name, sets:[{weight,reps}]}] }
  };
}

let data = loadData();

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  render();
}

function uid(prefix){
  return prefix + '_' + Date.now() + '_' + Math.floor(Math.random()*10000);
}

function activeSession(){
  return data.sessions.find(s => !s.finishedAt);
}

function allExerciseNames(){
  const names = new Set();
  data.templates.forEach(t => t.exercises.forEach(n => names.add(n)));
  data.sessions.forEach(s => s.exercises.forEach(e => names.add(e.name)));
  return [...names].sort();
}

function lastSetFor(exerciseName, beforeSessionId){
  // most recent finished session (excluding current) containing this exercise, its last set
  const finished = data.sessions
    .filter(s => s.finishedAt && s.id !== beforeSessionId)
    .sort((a,b) => new Date(b.startedAt) - new Date(a.startedAt));
  for(const s of finished){
    const ex = s.exercises.find(e => e.name === exerciseName);
    if(ex && ex.sets.length){
      return ex.sets[ex.sets.length - 1];
    }
  }
  return null;
}

// ---------- Formatting ----------

function formatHMS(ms){
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function formatDuration(ms){
  const totalMin = Math.round(ms / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if(h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function exerciseVolume(ex){
  return ex.sets.reduce((sum, s) => sum + (s.weight * s.reps), 0);
}

function sessionVolume(session){
  return session.exercises.reduce((sum, ex) => sum + exerciseVolume(ex), 0);
}

// ---------- Actions ----------

function startWorkout(templateId){
  if(activeSession()) return;
  const template = templateId ? data.templates.find(t => t.id === templateId) : null;
  data.sessions.push({
    id: uid('sess'),
    templateName: template ? template.name : 'Custom',
    startedAt: new Date().toISOString(),
    finishedAt: null,
    exercises: template ? template.exercises.map(name => ({ name, sets: [] })) : []
  });
  save();
}

function finishWorkout(){
  const s = activeSession();
  if(!s) return;
  s.finishedAt = new Date().toISOString();
  save();
}

function addSet(exerciseIdx, weight, reps){
  const s = activeSession();
  if(!s) return;
  s.exercises[exerciseIdx].sets.push({ weight, reps });
  save();
}

function removeSet(exerciseIdx, setIdx){
  const s = activeSession();
  if(!s) return;
  s.exercises[exerciseIdx].sets.splice(setIdx, 1);
  save();
}

function addExerciseToSession(name){
  const s = activeSession();
  if(!s || !name.trim()) return;
  if(s.exercises.some(e => e.name.toLowerCase() === name.trim().toLowerCase())) return;
  s.exercises.push({ name: name.trim(), sets: [] });
  save();
}

// ---------- Tabs ----------

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// ---------- Render: Train tab ----------

function renderTemplateGrid(){
  const grid = document.getElementById('templateGrid');
  grid.innerHTML = '';
  data.templates.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'template-btn';
    btn.innerHTML = `<span>${escapeHtml(t.name)}<span class="sub">${t.exercises.length} exercises</span></span><span>▸</span>`;
    btn.onclick = () => startWorkout(t.id);
    grid.appendChild(btn);
  });
  const customBtn = document.createElement('button');
  customBtn.className = 'template-btn';
  customBtn.innerHTML = `<span>Custom<span class="sub">Start blank, add exercises as you go</span></span><span>▸</span>`;
  customBtn.onclick = () => startWorkout(null);
  grid.appendChild(customBtn);
}

function renderActiveSession(){
  const s = activeSession();
  const startSection = document.getElementById('startSection');
  const activeSectionEl = document.getElementById('activeSection');

  if(!s){
    startSection.style.display = 'block';
    activeSectionEl.style.display = 'none';
    return;
  }
  startSection.style.display = 'none';
  activeSectionEl.style.display = 'block';

  document.getElementById('activeSessionName').textContent = s.templateName;
  document.getElementById('activeSessionMeta').textContent = `Total volume: ${sessionVolume(s).toLocaleString()}`;
  document.getElementById('sessionTimer').textContent = formatHMS(Date.now() - new Date(s.startedAt).getTime());

  const list = document.getElementById('exerciseList');
  list.innerHTML = '';
  s.exercises.forEach((ex, exIdx) => {
    list.appendChild(buildExerciseCard(ex, exIdx, s.id));
  });

  const addSelect = document.getElementById('addExerciseSelect');
  const existingNames = s.exercises.map(e => e.name.toLowerCase());
  addSelect.innerHTML = '';
  allExerciseNames().filter(n => !existingNames.includes(n.toLowerCase())).forEach(n => {
    const opt = document.createElement('option');
    opt.value = n;
    opt.textContent = n;
    addSelect.appendChild(opt);
  });
  const customOpt = document.createElement('option');
  customOpt.value = '__custom__';
  customOpt.textContent = '+ New exercise…';
  addSelect.appendChild(customOpt);
}

function buildExerciseCard(ex, exIdx, sessionId){
  const card = document.createElement('div');
  card.className = 'exercise-card';

  const head = document.createElement('div');
  head.className = 'exercise-card-head';
  head.innerHTML = `<span class="exercise-name">${escapeHtml(ex.name)}</span><span class="exercise-vol">${exerciseVolume(ex).toLocaleString()} vol</span>`;
  card.appendChild(head);

  if(ex.sets.length > 0){
    const labels = document.createElement('div');
    labels.className = 'set-labels';
    labels.innerHTML = `<span></span><span>Weight</span><span>Reps</span><span>Vol</span><span></span>`;
    card.appendChild(labels);

    ex.sets.forEach((set, setIdx) => {
      const row = document.createElement('div');
      row.className = 'set-row';
      row.innerHTML = `
        <span class="set-num">${setIdx+1}</span>
        <span>${set.weight}</span>
        <span>${set.reps}</span>
        <span class="set-vol">${(set.weight*set.reps).toLocaleString()}</span>
        <button class="remove-set" type="button">✕</button>
      `;
      row.querySelector('.remove-set').onclick = () => removeSet(exIdx, setIdx);
      card.appendChild(row);
    });
  }

  const last = lastSetFor(ex.name, sessionId);
  const addRow = document.createElement('div');
  addRow.className = 'set-row';
  addRow.style.marginTop = '6px';
  addRow.innerHTML = `
    <span class="set-num">+</span>
    <input type="number" step="0.5" class="new-weight" placeholder="kg" value="${last ? last.weight : ''}">
    <input type="number" step="1" class="new-reps" placeholder="reps" value="${last ? last.reps : ''}">
    <span></span>
    <span></span>
  `;
  card.appendChild(addRow);

  const addBtnRow = document.createElement('div');
  addBtnRow.className = 'add-set-row';
  const addBtn = document.createElement('button');
  addBtn.className = 'btn-ghost btn-small';
  addBtn.textContent = 'Add set';
  addBtn.onclick = () => {
    const weight = parseFloat(addRow.querySelector('.new-weight').value);
    const reps = parseInt(addRow.querySelector('.new-reps').value, 10);
    if(isNaN(weight) || isNaN(reps)){ alert('Enter a weight and rep count.'); return; }
    addSet(exIdx, weight, reps);
  };
  addBtnRow.appendChild(addBtn);
  card.appendChild(addBtnRow);

  return card;
}

document.getElementById('finishBtn').onclick = () => {
  if(confirm('Finish this workout?')) finishWorkout();
};

document.getElementById('addExerciseBtn').onclick = () => {
  const sel = document.getElementById('addExerciseSelect');
  if(sel.value === '__custom__'){
    const name = prompt('Exercise name:');
    if(name) addExerciseToSession(name);
  } else if(sel.value){
    addExerciseToSession(sel.value);
  }
};

// live session timer tick
setInterval(() => {
  const s = activeSession();
  if(s){
    document.getElementById('sessionTimer').textContent = formatHMS(Date.now() - new Date(s.startedAt).getTime());
  }
}, 1000);

// ---------- Render: History tab ----------

function renderHistoryList(){
  const listEl = document.getElementById('historyList');
  const finished = data.sessions.filter(s => s.finishedAt).sort((a,b) => new Date(b.startedAt) - new Date(a.startedAt));
  listEl.innerHTML = '';
  if(finished.length === 0){
    listEl.innerHTML = '<div class="empty-note">No finished workouts yet.</div>';
    return;
  }
  finished.forEach(s => {
    const item = document.createElement('div');
    item.className = 'history-item';
    const dateStr = new Date(s.startedAt).toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
    const durMs = new Date(s.finishedAt).getTime() - new Date(s.startedAt).getTime();

    const head = document.createElement('div');
    head.className = 'history-item-head';
    head.innerHTML = `
      <span>${escapeHtml(s.templateName)}<div class="sub">${dateStr} · ${formatDuration(durMs)}</div></span>
      <span>${sessionVolume(s).toLocaleString()} vol</span>
    `;
    const body = document.createElement('div');
    body.className = 'history-item-body';
    if(s.exercises.length === 0){
      body.innerHTML = '<div class="empty-note">No exercises logged.</div>';
    } else {
      s.exercises.forEach(ex => {
        const row = document.createElement('div');
        row.className = 'history-ex-row';
        const setsStr = ex.sets.map(st => `${st.weight}×${st.reps}`).join(', ');
        row.innerHTML = `<div>${escapeHtml(ex.name)}</div><div class="sets">${setsStr || 'no sets logged'}</div>`;
        body.appendChild(row);
      });
    }
    head.onclick = () => body.classList.toggle('open');
    item.appendChild(head);
    item.appendChild(body);
    listEl.appendChild(item);
  });
}

// ---------- Progress chart (top set weight per session, per exercise) ----------

function computeProgressSeries(exerciseName){
  const points = [];
  data.sessions
    .filter(s => s.finishedAt)
    .sort((a,b) => new Date(a.startedAt) - new Date(b.startedAt))
    .forEach(s => {
      const ex = s.exercises.find(e => e.name === exerciseName);
      if(ex && ex.sets.length){
        const topWeight = Math.max(...ex.sets.map(st => st.weight));
        points.push({ date: new Date(s.startedAt), weight: topWeight });
      }
    });
  return points;
}

function buildProgressSVG(points){
  const w = 340, h = 200;
  const padL = 40, padR = 12, padT = 14, padB = 26;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const n = points.length;
  const maxVal = Math.max(1, ...points.map(p => p.weight));
  const minVal = Math.min(...points.map(p => p.weight), maxVal);
  const range = Math.max(1, maxVal - minVal);

  const xAt = i => padL + (n <= 1 ? plotW/2 : i * (plotW/(n-1)));
  const yAt = v => padT + (1 - (v - minVal)/range) * plotH * 0.85 + plotH*0.075;

  const lineD = points.map((p,i) => (i===0?'M':'L') + xAt(i).toFixed(1) + ',' + yAt(p.weight).toFixed(1)).join(' ');
  const dots = points.map((p,i) => `<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(p.weight).toFixed(1)}" r="3" fill="#6089B4"/>`).join('');

  const labelIdxs = n <= 1 ? [0] : [0, Math.floor((n-1)/2), n-1];
  const xLabels = [...new Set(labelIdxs)].map(i => {
    return `<text x="${xAt(i).toFixed(1)}" y="${h-8}" font-size="9" fill="#6b6f66" text-anchor="middle">${points[i].date.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</text>`;
  }).join('');

  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; display:block;">
      <text x="${padL-6}" y="${(yAt(maxVal)+3).toFixed(1)}" font-size="9" fill="#6b6f66" text-anchor="end">${maxVal}</text>
      <text x="${padL-6}" y="${(yAt(minVal)+3).toFixed(1)}" font-size="9" fill="#6b6f66" text-anchor="end">${minVal}</text>
      <path d="${lineD}" fill="none" stroke="#6089B4" stroke-width="2.5"/>
      ${dots}
      ${xLabels}
    </svg>
  `;
}

function renderProgressChart(){
  const sel = document.getElementById('progressExerciseSelect');
  const container = document.getElementById('progressChartContainer');
  const prevVal = sel.value;

  sel.innerHTML = '';
  allExerciseNames().forEach(n => {
    const opt = document.createElement('option');
    opt.value = n;
    opt.textContent = n;
    sel.appendChild(opt);
  });
  if(prevVal && [...sel.options].some(o => o.value === prevVal)) sel.value = prevVal;

  if(!sel.value){
    container.innerHTML = '<div class="empty-note">Log a workout to see progress.</div>';
    return;
  }

  const points = computeProgressSeries(sel.value);
  if(points.length === 0){
    container.innerHTML = '<div class="empty-note">No finished sessions with this exercise yet.</div>';
    return;
  }
  container.innerHTML = buildProgressSVG(points) + `<div class="empty-note" style="padding-top:6px;">Top set weight per session</div>`;
}

document.getElementById('progressExerciseSelect').addEventListener('change', renderProgressChart);

// ---------- Render all ----------

function render(){
  document.getElementById('headerDate').textContent = new Date().toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
  renderTemplateGrid();
  renderActiveSession();
  renderHistoryList();
  renderProgressChart();
}

render();
</script>
</body>
</html>
